server {
  listen 8080;
  server_name _;
  client_max_body_size 6m;
  location /api/v1/auth/ { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
  location /api/v1/employees { proxy_pass http://127.0.0.1:3002; proxy_set_header Host $host; }
  location /api/v1/attendance { proxy_pass http://127.0.0.1:3003; proxy_set_header Host $host; }
  location /api/v1/documents { proxy_pass http://127.0.0.1:3004; proxy_set_header Host $host; }
  location /internal/ { return 404; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
